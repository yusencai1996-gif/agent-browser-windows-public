name: Windows core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # Keep the test parent canonical; runner TEMP may use a short-path alias.
      ABW_TEST_TMP: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
